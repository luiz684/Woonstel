<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moradores — Convive</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-frame">
  <div class="screen">
    <div class="topbar">
      <a class="back-btn" href="inicio.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1>Moradores</h1>
    </div>

    <div class="search-row">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="busca" placeholder="Buscar por nome ou unidade...">
      </div>
    </div>

    <div id="codeBox" class="role-note" style="display:none;"></div>
    <div class="list" id="list"></div>
  </div>
</div>
<script src="../js/data.js"></script>
<script src="../js/bottomnav-sindico.js"></script>
<script>
const user = requireAuth('sindico');
const cond = store.getCondominios().find(c=>c.sindicoId===user.id);

if(cond){
  document.getElementById('codeBox').style.display='block';
  document.getElementById('codeBox').innerHTML = `Compartilhe o código <strong>${cond.codigo}</strong> ou o nome "${cond.nome}" com os novos moradores para que eles vinculem a conta durante o cadastro.`;
}

function render(){
  if(!cond){ document.getElementById('list').innerHTML = `<div class="empty-state"><h3>Cadastre seu condomínio</h3></div>`; return; }
  let moradores = store.getMoradoresByCondominio(cond.id);
  const solicitacoes = store.getSolicitacoesByCondominio(cond.id);
  const busca = document.getElementById('busca').value.toLowerCase();
  if(busca) moradores = moradores.filter(m=>m.nome.toLowerCase().includes(busca) || (m.apto||'').toLowerCase().includes(busca));

  const el = document.getElementById('list');
  if(!moradores.length){ el.innerHTML = `<div class="empty-state" style="padding:30px 0;"><p>Nenhum morador vinculado ainda.</p></div>`; return; }
  el.innerHTML = moradores.map(m=>{
    const count = solicitacoes.filter(s=>s.moradorId===m.id).length;
    return `<div class="row-item">
      <div class="avatar">${initials(m.nome)}</div>
      <div class="ri-info">
        <h4>${m.nome}</h4>
        <p>Apto ${m.apto} · ${count} solicitação(ões)</p>
      </div>
    </div>`;
  }).join('');
}
document.getElementById('busca').addEventListener('input', render);
render();
renderSindicoNav('');
</script>
</body>
</html>
