<div class="screen">
  <div class="topbar">
    <a class="back-btn" routerLink="/sindico/inicio">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1>Perfil</h1>
  </div>

  @if (perfil(); as p) {
    <div style="text-align:center;margin-bottom:24px;">
      <div class="avatar" style="width:72px;height:72px;font-size:24px;margin:0 auto 12px;">{{ iniciais(p.nome) }}</div>
      <h2 style="font-size:17px;font-weight:700;">{{ p.nome }}</h2>
      <p style="font-size:13px;color:var(--text-muted);margin-top:2px;">Síndico</p>
    </div>

    <div class="detail-card">
      <div class="kv-row"><span class="k">Email</span><span class="v">{{ p.email }}</span></div>
      <div class="kv-row"><span class="k">CPF</span><span class="v">{{ p.cpf }}</span></div>
      <div class="kv-row"><span class="k">Condomínio</span><span class="v">{{ cond()?.nome ?? '—' }}</span></div>
      <div class="kv-row"><span class="k">Código de convite</span><span class="v">{{ cond()?.codigo ?? '—' }}</span></div>
    </div>

    <button class="btn btn-danger-ghost" type="button" (click)="sair()">Sair da conta</button>
  }
</div>
<app-bottom-nav-sindico active="perfil" />
