<div class="screen no-nav">
  <div class="auth-header">
    <div class="logo">
      <img src="Woonstel.png" alt="Logo" width="150" height="70">
    </div>
    <h1>Entrar na conta</h1>
  </div>

  <form (ngSubmit)="entrar()">
    <div class="field" [class.error]="erro().cpf">
      <label for="cpf">CPF</label>
      <div class="input-wrap">
        <svg class="icon-left" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 20c0-3.3 3.6-6 8-6s8 2.7 8 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14"
               autocomplete="off" [value]="cpf" (input)="onCpf($event)">
      </div>
      <div class="field-error-msg">Informe um CPF válido.</div>
    </div>

    <div class="field" [class.error]="erro().tipo">
      <label for="tipo">Tipo de Usuário</label>
      <div class="input-wrap">
        <select id="tipo" name="tipo" [(ngModel)]="tipo" [disabled]="tipoBloqueado()">
          <option value="" disabled>Selecione</option>
          <option value="condomino">Condômino</option>
          <option value="sindico">Síndico</option>
          <option value="funcionario">Funcionário</option>
        </select>
        <svg class="select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="field-error-msg">Selecione o tipo de usuário.</div>
    </div>

    <div class="field" [class.error]="erro().senha">
      <label for="senha">Senha</label>
      <div class="input-wrap">
        <svg class="icon-left" width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V7a4 4 0 018 0v4" stroke="currentColor" stroke-width="1.8"/></svg>
        <input [type]="mostrarSenha() ? 'text' : 'password'" id="senha" name="senha"
               placeholder="Sua senha" autocomplete="current-password"
               [(ngModel)]="senha" style="padding-right:40px;">
        <button type="button" class="toggle-pass" (click)="mostrarSenha.set(!mostrarSenha())" aria-label="Mostrar ou ocultar a senha">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>
      <div class="field-link-row"><a routerLink="/esqueci-senha">Esqueceu a senha?</a></div>
      <div class="field-error-msg">Informe sua senha.</div>
    </div>

    <button type="submit" class="btn btn-primary" style="margin-top:8px;" [disabled]="entrando()">Entrar</button>
  </form>

  <div class="role-note" style="margin-top:20px;">
    Moradores recebem um link de convite do síndico para criar o acesso.
  </div>
  <p class="auth-footer">É síndico e ainda não tem conta? <a routerLink="/criar-conta">Criar conta</a></p>
</div>
