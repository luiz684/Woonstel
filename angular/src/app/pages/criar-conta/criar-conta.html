<div class="screen no-nav">
  <div class="auth-header">
    <div class="logo">
      <img src="Woonstel.png" alt="Logo" width="150" height="70">
    </div>
    <h1>Criar conta de síndico</h1>
  </div>

  <div class="role-note">
    Esta tela é só para síndicos. Moradores recebem um link de convite do síndico do condomínio.
  </div>

  <form (ngSubmit)="criarConta()">
    <div class="field">
      <label for="nome">Nome completo</label>
      <div class="input-wrap">
        <input type="text" id="nome" name="nome" [(ngModel)]="nome" placeholder="Ex: Ana Carolina Souza Silva">
      </div>
    </div>

    <div class="field">
      <label for="email">E-mail</label>
      <div class="input-wrap">
        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Ex: ana@email.com">
      </div>
    </div>

    <div class="field">
      <label for="cpf">CPF</label>
      <div class="input-wrap">
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" [value]="cpf" (input)="onCpf($event)">
      </div>
    </div>

    <div class="field">
      <label for="senha">Senha</label>
      <div class="input-wrap">
        <input [type]="mostrarSenha() ? 'text' : 'password'" id="senha" name="senha"
               [(ngModel)]="senha" autocomplete="new-password" placeholder="Crie uma senha forte" style="padding-right:40px;">
        <button type="button" class="toggle-pass" (click)="mostrarSenha.set(!mostrarSenha())" aria-label="Mostrar ou ocultar a senha">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>
    </div>

    <app-regras-senha [senha]="senha" />

    <div class="field" [class.error]="erroConfirmar()">
      <label for="confirmar">Confirmar senha</label>
      <div class="input-wrap">
        <input [type]="mostrarSenha() ? 'text' : 'password'" id="confirmar" name="confirmar"
               [(ngModel)]="confirmar" autocomplete="new-password" placeholder="Repita a senha">
      </div>
      <div class="field-error-msg">As senhas não coincidem.</div>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="salvando()">Criar conta</button>
  </form>

  <p class="auth-footer">Já tem conta? <a routerLink="/">Entrar</a></p>
</div>
