<div class="screen">
  <div class="topbar">
    <a class="back-btn" routerLink="/morador/inicio">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1>Minhas Solicitações</h1>
  </div>

  <div class="search-row">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" placeholder="Buscar solicitações..." [value]="busca()" (input)="onBusca($event)">
    </div>
    <button class="filter-btn" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>
  </div>

  <div class="list">
    @for (s of lista(); track s.id) {
      <a class="req-card" [routerLink]="['/morador/solicitacao', s.id]">
        <div class="badge-row">
          <span class="badge badge-gray">{{ s.categoria?.toUpperCase() }}</span>
          <span class="badge" [class]="badge[s.status]">{{ s.status }}</span>
        </div>
        <h3>{{ s.titulo }}</h3>
        <p class="meta">Criado em {{ data(s.created_at) }} · <strong>{{ s.prioridade }} prioridade</strong></p>
      </a>
    } @empty {
      <div class="empty-state">
        <div class="ei"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 5h6M9 3v4M4 8h16v11a2 2 0 01-2 2H6a2 2 0 01-2-2V8z"/></svg></div>
        <h3>Nenhuma solicitação encontrada</h3>
        <p>Suas solicitações de manutenção vão aparecer aqui.</p>
      </div>
    }
  </div>
</div>
<app-bottom-nav-morador active="ocorrencias"/>
