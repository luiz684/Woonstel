<div class="screen">
  <div class="topbar">
    <a class="back-btn" routerLink="/morador/inicio">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1>Minhas Reservas</h1>
    <a class="topbar-sub btn-sm btn-ghost btn" style="width:auto;" routerLink="/morador/reservar-area">+ Nova</a>
  </div>

  <div class="list">
    @for (r of reservas(); track r.id) {
      <div class="req-card">
        <div class="badge-row"><span class="badge badge-green">{{ r.status }}</span></div>
        <h3>{{ r.area_nome }}</h3>
        <p class="meta">{{ data(r.data) }} · {{ r.periodo }}</p>
        <p class="meta" style="margin-top:4px;"><strong>{{ r.valor > 0 ? brl(r.valor) : 'Sem taxa' }}</strong></p>
      </div>
    } @empty {
      <div class="empty-state">
        <h3>Nenhuma reserva ainda</h3>
        <p>Reserve uma área comum no atalho da tela inicial.</p>
      </div>
    }
  </div>
</div>
<app-bottom-nav-morador active="reservas" />
