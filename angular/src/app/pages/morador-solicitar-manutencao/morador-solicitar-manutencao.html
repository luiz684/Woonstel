<div class="screen">
  <div class="topbar">
    <a class="back-btn" routerLink="/morador/inicio">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1>Solicitar Manutenção</h1>
  </div>

  <form (ngSubmit)="registrar()">
    <div class="field">
      <label for="titulo">Título da Solicitação</label>
      <div class="input-wrap">
        <svg class="icon-left" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        <input type="text" id="titulo" name="titulo" [(ngModel)]="titulo" placeholder="Ex: Infiltração na parede da garagem">
      </div>
    </div>

    <div class="field">
      <label for="categoria">Categoria</label>
      <div class="input-wrap">
        <svg class="icon-left" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
        <select id="categoria" name="categoria" [(ngModel)]="categoria">
          <option value="Elétrica">Elétrica</option>
          <option value="Hidráulica">Hidráulica</option>
          <option value="Estrutural">Estrutural</option>
          <option value="Limpeza">Limpeza</option>
          <option value="Outros">Outros</option>
        </select>
        <svg class="select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <div class="field">
      <label for="descricao">Descrição</label>
      <textarea id="descricao" name="descricao" [(ngModel)]="descricao" placeholder="Descreva detalhadamente o problema encontrado..."></textarea>
    </div>

    <div class="field">
      <label for="local">Localização / Bloco</label>
      <div class="input-wrap">
        <svg class="icon-left" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <input type="text" id="local" name="local" [(ngModel)]="local" placeholder="Ex: Garagem G2, vaga 44">
      </div>
    </div>

    <div class="field">
      <label>Prioridade</label>
      <div class="chip-row">
        @for (p of prioridades; track p) {
          <div class="chip" [class.active]="prioridade() === p" (click)="prioridade.set(p)">{{ p }}</div>
        }
      </div>
    </div>

    <div class="field">
      <label>Foto (opcional)</label>
      <label class="upload-box" for="fotoInput" style="cursor:pointer;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>
        <span>{{ nomeFoto() || 'Adicionar foto do problema' }}</span>
      </label>
      <input type="file" id="fotoInput" accept="image/*" style="display:none;" (change)="onFoto($event)">
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="salvando()">Registrar solicitação</button>
  </form>
</div>
