<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Convive</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-frame">
  <div class="screen no-nav">
    <div class="auth-header">
      <div class="logo">
        <img src="Woonstel.png" alt="Logo" width="150" height="70">
      </div>
      <h1>Entrar na conta</h1>
    </div>

    <form id="loginForm" novalidate>
      <div class="field" id="f-cpf">
        <label for="cpf">CPF</label>
        <div class="input-wrap">
          <svg class="icon-left" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 20c0-3.3 3.6-6 8-6s8 2.7 8 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" autocomplete="off">
        </div>
        <div class="field-error-msg">Informe um CPF válido.</div>
      </div>

      <div class="field" id="f-tipo">
        <label for="tipo">Tipo de Usuário</label>
        <div class="input-wrap">
          <select id="tipo">
            <option value="" disabled selected>Selecione</option>
            <option value="condomino">Condômino</option>
            <option value="sindico">Síndico</option>
            <option value="funcionario">Funcionário</option>
          </select>
          <svg class="select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="field-error-msg">Selecione o tipo de usuário.</div>
      </div>

      <div class="field" id="f-senha">
        <label for="senha">Senha</label>
        <div class="input-wrap">
          <svg class="icon-left" width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V7a4 4 0 018 0v4" stroke="currentColor" stroke-width="1.8"/></svg>
          <input type="password" id="senha" placeholder="Sua senha" autocomplete="current-password" style="padding-right:40px;">
          <button type="button" class="toggle-pass" data-target="senha">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
        </div>
        <div class="field-link-row"><a href="esqueci-senha.html">Esqueceu a senha?</a></div>
        <div class="field-error-msg">Informe sua senha.</div>
      </div>

      <button type="submit" class="btn btn-primary" style="margin-top:8px;">Entrar</button>
    </form>

    <p class="auth-footer">Não tem conta? <a href="criar-conta.html">Cadastre-se</a></p>

    <div class="demo-box">
      <strong>Contas de demonstração</strong><br>
      Síndico — CPF 111.111.111-11 · senha 123456<br>
      Condômino — CPF 222.222.222-22 · senha 123456
    </div>
  </div>
</div>
<script src="js/data.js"></script>
<script>
document.querySelectorAll('.toggle-pass').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const inp = document.getElementById(btn.dataset.target);
    inp.type = inp.type === 'password' ? 'text' : 'password';
  });
});

const cpfInput = document.getElementById('cpf');
cpfInput.addEventListener('input', ()=>{
  let v = cpfInput.value.replace(/\D/g,'').slice(0,11);
  v = v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  cpfInput.value = v;
});

// já logado? pula direto
(function(){
  const u = store.getCurrentUser();
  if(u){ window.location.href = u.tipo==='sindico' ? 'sindico/inicio.html' : 'morador/inicio.html'; }
})();

document.getElementById('loginForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  let valid = true;
  ['f-cpf','f-tipo','f-senha'].forEach(id=>document.getElementById(id).classList.remove('error'));

  const cpf = cpfInput.value.trim();
  const tipo = document.getElementById('tipo').value;
  const senha = document.getElementById('senha').value;

  if(cpf.length < 14){ document.getElementById('f-cpf').classList.add('error'); valid=false; }
  if(!tipo){ document.getElementById('f-tipo').classList.add('error'); valid=false; }
  if(!senha){ document.getElementById('f-senha').classList.add('error'); valid=false; }
  if(!valid) return;

  const user = store.findUserByCpfTipo(cpf, tipo);
  if(!user || user.senha !== senha){
    showToast('CPF, tipo de usuário ou senha incorretos.');
    return;
  }
  store.setSession(user.id);
  window.location.href = user.tipo==='sindico' ? 'sindico/inicio.html' : 'morador/inicio.html';
});
</script>
</body>
</html>
