<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woonstel - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <section class="screen active">

            <div class="logo">W</div>

            <h1>Entrar na conta</h1>

            <form id="loginForm">

                <label for="cpfLogin">CPF</label>

                <div class="input-wrap">
                    <span>♙</span>

                    <input
                        id="cpfLogin"
                        type="text"
                        inputmode="numeric"
                        maxlength="14"
                        placeholder="000.000.000-00"
                        required
                    >
                </div>

                <label for="tipoLogin">Tipo de Usuário</label>

                <div class="select-wrap">

                    <select id="tipoLogin" required>
                        <option value="" selected disabled>
                            Selecione
                        </option>

                        <option value="morador">
                            Morador
                        </option>

                        <option value="funcionario">
                            Funcionário
                        </option>

                        <option value="sindico">
                            Síndico
                        </option>
                    </select>

                    <span>⌄</span>

                </div>

                <label for="senhaLogin">Senha</label>

                <div class="input-wrap">
                    <span>▣</span>

                    <input
                        id="senhaLogin"
                        type="password"
                        placeholder="••••••••••"
                        required
                    >

                    <button
                        type="button"
                        class="eye"
                        data-target="senhaLogin"
                    >
                        ◉
                    </button>
                </div>

                <a
                    href="recuperar-senha.html"
                    class="forgot"
                >
                    Esqueceu a senha?
                </a>

                <button
                    class="primary login-button"
                    type="submit"
                >
                    Entrar
                </button>

            </form>

            <p class="bottom-link">
                Não tem conta?

                <a href="criar-conta.html">
                    Cadastre-se
                </a>
            </p>

        </section>

    </main>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>

</body>

</html>
