<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitar Manutenção — Convive</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-frame">
  <div class="screen">
    <div class="topbar">
      <a class="back-btn" href="inicio.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1>Solicitar Manutenção</h1>
    </div>

    <form id="reqForm" novalidate>
      <div class="field">
        <label for="titulo">Título da Solicitação</label>
        <div class="input-wrap">
          <svg class="icon-left" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
          <input type="text" id="titulo" placeholder="Ex: Infiltração na parede da garagem">
        </div>
      </div>

      <div class="field">
        <label for="categoria">Categoria</label>
        <div class="input-wrap">
          <svg class="icon-left" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
          <select id="categoria">
            <option value="Elétrica">Elétrica</option>
            <option value="Hidráulica">Hidráulica</option>
            <option value="Estrutural">Estrutural</option>
            <option value="Limpeza">Limpeza</option>
            <option value="Outros">Outros</option>
          </select>
          <svg class="select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>

      <div class="field">
        <label for="descricao">Descrição</label>
        <textarea id="descricao" placeholder="Descreva detalhadamente o problema encontrado..."></textarea>
      </div>

      <div class="field">
        <label for="local">Localização / Bloco</label>
        <div class="input-wrap">
          <svg class="icon-left" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <input type="text" id="local" placeholder="Ex: Garagem G2, vaga 44">
        </div>
      </div>

      <div class="field">
        <label>Prioridade</label>
        <div class="chip-row" id="prioridadeRow">
          <div class="chip" data-value="Baixa">Baixa</div>
          <div class="chip active" data-value="Média">Média</div>
          <div class="chip" data-value="Alta">Alta</div>
        </div>
      </div>

      <div class="field">
        <label>Foto (opcional)</label>
        <label class="upload-box" for="fotoInput" style="cursor:pointer;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>
          <span id="fotoLabel">Adicionar foto do problema</span>
        </label>
        <input type="file" id="fotoInput" accept="image/*" style="display:none;">
      </div>

      <button type="submit" class="btn btn-primary">Registrar solicitação</button>
    </form>
  </div>
</div>
<script src="../js/data.js"></script>
<script>
const user = requireAuth('condomino');

document.querySelectorAll('#prioridadeRow .chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('#prioridadeRow .chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
  });
});

document.getElementById('fotoInput').addEventListener('change', (e)=>{
  if(e.target.files[0]) document.getElementById('fotoLabel').textContent = e.target.files[0].name;
});

document.getElementById('reqForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const titulo = document.getElementById('titulo').value.trim();
  const local = document.getElementById('local').value.trim();
  const descricao = document.getElementById('descricao').value.trim();
  if(!titulo || !local || !descricao){
    showToast('Preencha título, localização e descrição.');
    return;
  }
  const prioridade = document.querySelector('#prioridadeRow .chip.active').dataset.value;
  const categoria = document.getElementById('categoria').value;

  const now = new Date();
  const dataLabel = now.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','') + ' · ' + now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  store.saveSolicitacao({
    id:'s'+Date.now(), condominioId:user.condominioId, moradorId:user.id, moradorNome:user.nome, apto:user.apto,
    titulo, categoria, prioridade, status:'Pendente', localizacao:local, descricao,
    criadoEm: now.toISOString(), foto: !!document.getElementById('fotoInput').files[0],
    historico:[{status:'Solicitação registrada', data:dataLabel, done:true}]
  });

  showToast('Solicitação registrada com sucesso!');
  setTimeout(()=>{ window.location.href = 'minhas-solicitacoes.html'; }, 1000);
});
</script>
</body>
</html>
