<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueci minha senha — Convive</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="app-frame">
    <div class="screen no-nav">
      <div class="auth-header">
        <div class="Logo">
          <img src="Woonstel.png" alt="Logo" width="70" height="70">
        </div>
        <h1>Esqueceu sua senha?</h1>
      </div>

      <div id="step1">
        <p style="text-align:center;color:var(--primary);font-weight:600;font-size:14px;margin-bottom:26px;">
          Informe seu e-mail para continuar
        </p>

        <p style="text-align:center;color:var(--primary);font-weight:700;font-size:13.5px;margin-bottom:10px;">
          Qual o e-mail da sua conta?
        </p>

        <form id="recoverForm" novalidate>
          <div class="field">
            <div class="input-wrap">
              <svg class="icon-left" width="16" height="16" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8" />
                <path d="M3 7l9 6 9-6" stroke="currentColor" stroke-width="1.8" />
              </svg>
              <input type="email" id="email" placeholder="Informe o seu email">
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Enviar instruções</button>
        </form>
      </div>

      <div id="step2" style="display:none;text-align:center;">
        <div class="banner banner-amber" style="text-align:left;">
          <div class="banner-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8" />
              <path d="M3 7l9 6 9-6" stroke="currentColor" stroke-width="1.8" />
            </svg>
          </div>
          <div>
            <strong>Instruções enviadas</strong>
            <span>Se o e-mail informado tiver uma conta no Convive, você vai receber um link para redefinir sua
              senha.</span>
          </div>
        </div>
        <a href="index.html" class="btn btn-primary" style="display:flex;">Voltar para o login</a>
      </div>

      <p class="auth-footer">Ainda não tem conta? <a href="criar-conta.html">Criar conta</a></p>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script>
    document.getElementById('recoverForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) { showToast('Informe um e-mail válido.'); return; }
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
    });
  </script>
</body>

</html>
